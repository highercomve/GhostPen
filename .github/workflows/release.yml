# On a v* tag: test GhostPen, package it on each OS with the Oriel CLI (the
# way any Oriel app ships), and attach the packages and SHA256SUMS to the
# GitHub release. The site's download buttons read that release.
#
# Linux runs in an Arch Linux container: GTK 4 / WebKitGTK 6.0 are newer
# than Ubuntu LTS ships. The Linux packages run whisper and the built-in
# models on the GPU through Vulkan (any vendor; the CPU when there is no
# Vulkan driver). CUDA builds need the toolkit: `oriel build -Dcuda`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  # The Oriel CLI used to package; the app's Oriel dependency is pinned in build.zig.zon.
  ORIEL_VERSION: v0.6.4
  NFPM_VERSION: 2.43.0
  ARCH_PACKAGES: >-
    git pkgconf gtk4 webkitgtk-6.0 gtk4-layer-shell wayland wayland-protocols
    libxkbcommon libxtst libx11 libpulse alsa-lib nodejs npm curl
    xorg-server-xvfb xorg-xauth xdotool xsel dbus ttf-dejavu python imagemagick squashfs-tools
    vulkan-headers spirv-headers vulkan-icd-loader shaderc

jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Oriel CLI and nfpm
        run: |
          curl -fsSL https://raw.githubusercontent.com/highercomve/Oriel/main/install.sh | ORIEL_VERSION=$ORIEL_VERSION ORIEL_INSTALL_DIR=/usr/local/bin sh
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin nfpm
          oriel --version && nfpm --version
      - name: Unit tests
        run: zig build test --summary all
      - name: Package (deb, rpm, AppImage)
        run: oriel package -Dvulkan
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: zig-out/package/*

  # The same Linux packages with CUDA as well ("-cuda" in the file names):
  # CUDA for NVIDIA GPUs from Turing (RTX 20xx) to Blackwell (RTX 50xx),
  # using the system's CUDA 13 runtime (cuBLAS); without it they run on
  # Vulkan like the regular packages. They update from their own entry in
  # latest.json (x86_64-linux-cuda), so they stay CUDA builds.
  linux-cuda:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 240
    steps:
      - name: System packages
        # nvcc compiles host code with GCC (optional for the cuda package).
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES cuda gcc
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Oriel CLI and nfpm
        run: |
          curl -fsSL https://raw.githubusercontent.com/highercomve/Oriel/main/install.sh | ORIEL_VERSION=$ORIEL_VERSION ORIEL_INSTALL_DIR=/usr/local/bin sh
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin nfpm
      - name: Package (deb, rpm, AppImage with CUDA and Vulkan)
        run: |
          # The toolkit, and the host compiler nvcc supports (NVCC_CCBIN, from
          # Arch's profile script, which a non-login shell doesn't read).
          export CUDA_PATH=/opt/cuda PATH="/opt/cuda/bin:$PATH"
          eval "$(grep '^export NVCC_CCBIN=' /etc/profile.d/cuda.sh)"
          nvcc --version | tail -1; echo "NVCC_CCBIN=$NVCC_CCBIN"
          oriel package -Dvulkan -Dcuda -Dcuda_arch=75,86,89,120a -Dupdate_target=x86_64-linux-cuda
          cd zig-out/package
          for f in *.AppImage *.deb *.rpm; do mv "$f" "${f%.*}-cuda.${f##*.}"; done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cuda
          path: zig-out/package/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Oriel CLI, NSIS, WebView2 loader
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP "oriel"
          $env:ORIEL_INSTALL_DIR = $bin
          irm https://raw.githubusercontent.com/highercomve/Oriel/main/install.ps1 | iex
          Add-Content $env:GITHUB_PATH $bin
          $env:Path = "$bin;$env:Path"
          oriel setup nsis --yes
          oriel setup webview2 --yes
      - name: Package (setup.exe)
        run: oriel package
      # What the in-app updater installs on Windows: the exe itself.
      - name: Updater payload
        shell: pwsh
        run: |
          oriel build
          Copy-Item zig-out/bin/ghostpen.exe zig-out/package/ghostpen-x86_64-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: zig-out/package/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Oriel CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/highercomve/Oriel/main/install.sh | ORIEL_VERSION=$ORIEL_VERSION ORIEL_INSTALL_DIR=/usr/local/bin sh
          oriel --version
      - name: Unit tests
        run: zig build test --summary all
      # Ad-hoc signed. For Developer ID signing and notarization, set the
      # secrets and pass -Dmacos-sign-identity / -Dmacos-notarize-profile.
      - name: Package (.app, .dmg)
        run: oriel package
      # The .app zipped for people, and tarred for the in-app updater (format app.tar.gz).
      - name: Zip the .app
        run: |
          cd zig-out/package
          ditto -c -k --keepParent GhostPen.app GhostPen-macos.app.zip
          tar -czf GhostPen-aarch64-macos.app.tar.gz GhostPen.app
          rm -rf GhostPen.app GhostPen.entitlements
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: zig-out/package/*

  release:
    needs: [linux, linux-cuda, windows, macos]
    runs-on: ubuntu-latest
    # `zig build sign-update` configures the app's build: GTK/WebKit pkg-config data.
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # One signed latest.json for the in-app updater (Settings → About &
      # updates): an entry per platform, each signed with the release key.
      - name: Sign the update manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          UPDATE_KEY: ${{ secrets.GHOSTPEN_UPDATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "::warning::GHOSTPEN_UPDATE_KEY is not set: no latest.json (in-app updates won't see this release)."
            exit 0
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$UPDATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          V="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          sign() { # <asset> <target> <format>
            zig build sign-update -- "dist/$1" --app-id dev.ghostpen.Oriel --version "$V" \
              --target "$2" --url "$BASE/$1" --key "$KEY_FILE" --format "$3" --out "dist/update-$2.json"
          }
          sign "ghostpen-$V-x86_64.AppImage" x86_64-linux raw
          sign "ghostpen-$V-x86_64-cuda.AppImage" x86_64-linux-cuda raw
          sign ghostpen-x86_64-windows.exe x86_64-windows raw
          sign GhostPen-aarch64-macos.app.tar.gz aarch64-macos app.tar.gz
          zig build combine-manifests -- dist/update-*.json \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out dist/latest.json
          rm -f dist/update-*.json
          cat dist/latest.json
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
