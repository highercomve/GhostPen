# On a v* tag: test GhostPen, package it on each OS with the Oriel CLI (the
# way any Oriel app ships), and attach the packages and SHA256SUMS to the
# GitHub release. The site's download buttons read that release.
#
# Linux runs in an Arch Linux container: GTK 4 / WebKitGTK 6.0 are newer
# than Ubuntu LTS ships. The Linux packages run whisper and the built-in
# models on the GPU through Vulkan (any vendor; the CPU when there is no
# Vulkan driver). CUDA builds need the toolkit: `oriel build -Dcuda`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  # The Oriel CLI used to package; the app's Oriel dependency is pinned in build.zig.zon.
  ORIEL_VERSION: v0.6.20
  NFPM_VERSION: 2.43.0
  # Windows GPU builds: glslc and the Vulkan headers (LunarG SDK).
  VULKAN_SDK_VERSION: 1.4.357.0
  ARCH_PACKAGES: >-
    git pkgconf gtk4 webkitgtk-6.0 gtk4-layer-shell wayland wayland-protocols
    libxkbcommon libxtst libx11 libpulse alsa-lib nodejs npm curl
    xorg-server-xvfb xorg-xauth xdotool xsel dbus ttf-dejavu python imagemagick squashfs-tools
    vulkan-headers spirv-headers vulkan-icd-loader shaderc

jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Oriel CLI and nfpm
        run: |
          curl -fsSL https://raw.githubusercontent.com/highercomve/Oriel/main/install.sh | ORIEL_VERSION=$ORIEL_VERSION ORIEL_INSTALL_DIR=/usr/local/bin sh
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin nfpm
          oriel --version && nfpm --version
      - name: Unit tests
        run: zig build test --summary all
      - name: Package (deb, rpm, AppImage)
        run: oriel package -Dvulkan
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: zig-out/package/*

  # The same Linux packages with CUDA as well ("-cuda" in the file names):
  # CUDA for NVIDIA GPUs from Turing (RTX 20xx) to Blackwell (RTX 50xx),
  # using the system's CUDA 13 runtime (cuBLAS); without it they run on
  # Vulkan like the regular packages. They update from their own entry in
  # latest.json (x86_64-linux-cuda), so they stay CUDA builds.
  linux-cuda:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 240
    env:
      CUDA_ARCHS: 75,86,89,120a
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Oriel CLI and nfpm
        run: |
          curl -fsSL https://raw.githubusercontent.com/highercomve/Oriel/main/install.sh | ORIEL_VERSION=$ORIEL_VERSION ORIEL_INSTALL_DIR=/usr/local/bin sh
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin nfpm
      # libggml-cuda.so takes ~70 min of nvcc on a hosted runner, and only
      # changes with Oriel's ggml, the GPU list or the CUDA version: it is
      # cached under those, and the toolkit is only installed to rebuild it.
      - name: CUDA library cache key
        run: |
          # What the library is built from: Oriel's pinned llama.cpp (ggml)
          # and the CUDA parts of its ggml build script (nvcc flags, sources),
          # not the Oriel version or its other backends.
          zig build --fetch >/dev/null
          ORIEL_DIR=$(ls -d zig-pkg/oriel-$(sed -n 's/.*\.hash = "oriel-\([^"]*\)".*/\1/p' build.zig.zon))
          CUDA_PARTS='/^pub const CudaOptions/,/^};/{print} /^fn cudaArchArgs/,/^}/{print} /^fn isComputeCapability/,/^}/{print} /^fn addCudaBackend/,/^}/{print} /^const cuda_sources/,/^};/{print}'
          # Comments and error reporting don't change the library: left out,
          # so a reworded message doesn't rebuild it.
          GGML_KEY=$( { grep -A2 '\.llama = ' "$ORIEL_DIR/build.zig.zon"; awk "$CUDA_PARTS" "$ORIEL_DIR/build/ggml.zig" | grep -v -E '^\s*//|buildFail|panic\(' ; } | sha256sum | cut -c1-16)
          echo "GGML_KEY=$GGML_KEY" >> "$GITHUB_ENV"
          # Cache keys can't contain commas.
          echo "CUDA_ARCHS_KEY=${CUDA_ARCHS//,/_}" >> "$GITHUB_ENV"
          echo "CUDA_VERSION=$(pacman -Si cuda | sed -n 's/^Version *: *//p')" >> "$GITHUB_ENV"
      - name: CUDA library cache
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: cuda-cache/libggml-cuda.so
          key: ggml-cuda-${{ env.GGML_KEY }}-${{ env.CUDA_ARCHS_KEY }}-cuda-${{ env.CUDA_VERSION }}
      - name: Build libggml-cuda.so (cache miss)
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        run: |
          # nvcc compiles host code with GCC (optional for the cuda package).
          pacman -S --noconfirm --needed cuda gcc
          # The toolkit, and the host compiler nvcc supports (NVCC_CCBIN, from
          # Arch's profile script, which a non-login shell doesn't read).
          export CUDA_PATH=/opt/cuda PATH="/opt/cuda/bin:$PATH"
          eval "$(grep '^export NVCC_CCBIN=' /etc/profile.d/cuda.sh)"
          nvcc --version | tail -1; echo "NVCC_CCBIN=$NVCC_CCBIN"
          oriel build -Dcuda -Dcuda_arch=$CUDA_ARCHS
          mkdir -p cuda-cache
          cp zig-out/bin/libggml-cuda.so cuda-cache/
      - name: Package (deb, rpm, AppImage with CUDA and Vulkan)
        run: |
          oriel package -Dvulkan -Dcuda_prebuilt="$PWD/cuda-cache/libggml-cuda.so" -Dupdate_target=x86_64-linux-cuda
          cd zig-out/package
          for f in *.AppImage *.deb *.rpm; do mv "$f" "${f%.*}-cuda.${f##*.}"; done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-cuda
          path: zig-out/package/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Oriel CLI, NSIS, WebView2 loader
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP "oriel"
          $env:ORIEL_INSTALL_DIR = $bin
          irm https://raw.githubusercontent.com/highercomve/Oriel/main/install.ps1 | iex
          Add-Content $env:GITHUB_PATH $bin
          $env:Path = "$bin;$env:Path"
          oriel setup nsis --yes
          oriel setup webview2 --yes
      # Whisper and the local model on the GPU through Vulkan (any vendor),
      # compiled into ghostpen.exe; without a Vulkan driver it runs on the CPU.
      # Only glslc and the headers are used, at build time.
      - name: Vulkan SDK (cache)
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}
      - name: Vulkan SDK
        shell: pwsh
        run: |
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if ("${{ steps.vulkan-cache.outputs.cache-hit }}" -ne "true") {
            $exe = Join-Path $env:RUNNER_TEMP "vulkansdk.exe"
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe" -OutFile $exe
            $p = Start-Process $exe -ArgumentList "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Vulkan SDK install failed ($($p.ExitCode))" }
          }
          & "$root\Bin\glslc.exe" --version
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$root"
      # On a tag, also the WinGet manifests for this setup.exe (the release
      # URL it will have); the winget job submits them once it's published.
      - name: Package (setup.exe)
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            oriel package -Dvulkan -Dwinget-url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          else
            oriel package -Dvulkan
          fi
      # What the in-app updater installs on Windows: the exe itself (built
      # the same way, or updates would replace the GPU build with a CPU one).
      - name: Updater payload
        shell: pwsh
        run: |
          oriel build -Dvulkan
          Copy-Item zig-out/bin/ghostpen.exe zig-out/package/ghostpen-x86_64-windows.exe
      - name: WinGet manifests
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: winget
          path: zig-out/package/winget/*
      - name: Remove the manifests from the release files
        shell: bash
        run: rm -rf zig-out/package/winget
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: zig-out/package/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Oriel CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/highercomve/Oriel/main/install.sh | ORIEL_VERSION=$ORIEL_VERSION ORIEL_INSTALL_DIR=/usr/local/bin sh
          oriel --version
      - name: Unit tests
        run: zig build test --summary all
      # Signed with GhostPen's self-signed certificate (`oriel signing`): the
      # same identity every release, so macOS keeps the Accessibility and
      # microphone grants across updates (ad-hoc builds lose them). Gatekeeper
      # still asks once; a Developer ID with notarization would remove that.
      - name: Package (.app, .dmg)
        env:
          MACOS_CERT_P12: ${{ secrets.GHOSTPEN_MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.GHOSTPEN_MACOS_CERT_PASSWORD }}
          # The certificate's SHA-1 (public; `oriel signing show`), a repository variable.
          MACOS_SIGN_IDENTITY: ${{ vars.GHOSTPEN_MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "::warning::GHOSTPEN_MACOS_CERT_P12 or GHOSTPEN_MACOS_SIGN_IDENTITY is not set: the app is signed ad-hoc (permissions reset on every update)."
            oriel package
            exit 0
          fi
          CERT="$RUNNER_TEMP/ghostpen-codesign.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERT"
          oriel signing import "$CERT" --password-env MACOS_CERT_PASSWORD
          rm -f "$CERT"
          oriel package -Dmacos-sign-identity=$MACOS_SIGN_IDENTITY
          codesign -d -r- zig-out/package/GhostPen.app
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain oriel-signing.keychain-db 2>/dev/null || true
      # The .app zipped for people, and tarred for the in-app updater (format app.tar.gz).
      - name: Zip the .app
        run: |
          cd zig-out/package
          ditto -c -k --keepParent GhostPen.app GhostPen-macos.app.zip
          tar -czf GhostPen-aarch64-macos.app.tar.gz GhostPen.app
          rm -rf GhostPen.app GhostPen.entitlements
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: zig-out/package/*

  release:
    needs: [linux, linux-cuda, windows, macos]
    runs-on: ubuntu-latest
    # `zig build sign-update` configures the app's build: GTK/WebKit pkg-config data.
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed $ARCH_PACKAGES
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      # One signed latest.json for the in-app updater (Settings → About &
      # updates): an entry per platform, each signed with the release key.
      - name: Sign the update manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          UPDATE_KEY: ${{ secrets.GHOSTPEN_UPDATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "::warning::GHOSTPEN_UPDATE_KEY is not set: no latest.json (in-app updates won't see this release)."
            exit 0
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$UPDATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          V="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          sign() { # <asset> <target> <format>
            zig build sign-update -- "dist/$1" --app-id dev.ghostpen.Oriel --version "$V" \
              --target "$2" --url "$BASE/$1" --key "$KEY_FILE" --format "$3" --out "dist/update-$2.json"
          }
          sign "ghostpen-$V-x86_64.AppImage" x86_64-linux raw
          sign "ghostpen-$V-x86_64-cuda.AppImage" x86_64-linux-cuda raw
          sign ghostpen-x86_64-windows.exe x86_64-windows raw
          sign GhostPen-aarch64-macos.app.tar.gz aarch64-macos app.tar.gz
          zig build combine-manifests -- dist/update-*.json \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out dist/latest.json
          rm -f dist/update-*.json
          cat dist/latest.json
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  # Rebuild the site so its cached release.json lists the new downloads. A
  # release published with GITHUB_TOKEN doesn't trigger other workflows, but
  # a workflow_dispatch does.
  site:
    needs: [release]
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  # WinGet (`winget install Highercomve.GhostPen`): a pull request to
  # microsoft/winget-pkgs with this release's manifests, once its setup.exe is
  # downloadable. Needs the WINGET_TOKEN secret (a GitHub token with
  # public_repo, for the fork and the pull request); skipped without it.
  winget:
    needs: [release]
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winget
          path: winget
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Output "::warning::WINGET_TOKEN is not set: the WinGet manifests were not submitted."
            exit 0
          }
          Get-ChildItem winget | ForEach-Object { Write-Output "== $($_.Name)"; Get-Content $_.FullName }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # The token through wingetcreate's environment variable, not argv.
          $env:WINGET_CREATE_GITHUB_TOKEN = $env:WINGET_TOKEN
          .\wingetcreate.exe submit --prtitle "GhostPen ${{ github.ref_name }}" winget
